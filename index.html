<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="생활비 관리">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2d6a22">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232d6a22'/><text y='.9em' font-size='80' x='10'>💰</text></svg>">
<title>생활비 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f4f0;--surface:#fff;--border:#e2e0d8;
  --text:#1a1814;--muted:#888077;--accent:#2d6a22;
  --accent-light:#e6f2e3;--danger:#c0392b;--danger-light:#fdf0ee;
  --blue:#2563eb;--blue-light:#eff6ff;
  --font:'Noto Sans KR',sans-serif
}
html,body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100%}
*{-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}

/* 로그인 */
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:24px;padding:32px}
.login-icon{font-size:60px}
.login-title{font-size:30px;font-weight:900;letter-spacing:-1px}
.login-sub{font-size:15px;color:var(--muted);text-align:center;line-height:1.7}
.btn-google{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--border);border-radius:14px;padding:16px 28px;font-family:var(--font);font-size:16px;font-weight:700;cursor:pointer;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.btn-google svg{width:22px;height:22px}

/* 상단바 */
#mainApp{display:none;flex-direction:column}
.topbar{background:var(--surface);border-bottom:2px solid var(--border);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.month-nav{display:flex;align-items:center;gap:10px}
.month-btn{background:var(--bg);border:2px solid var(--border);color:var(--muted);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;font-weight:700}
.month-label{font-size:18px;font-weight:900;letter-spacing:-.5px}
.user-btn{display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:var(--muted);font-size:14px;font-family:var(--font);font-weight:500}
.user-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--border)}

/* 요약 */
.summary{background:var(--accent);padding:20px 18px}
.summary-label{font-size:13px;color:rgba(255,255,255,.7);font-weight:500}
.summary-total{font-size:38px;font-weight:900;color:#fff;letter-spacing:-2px;margin:4px 0 14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bar-label{font-size:13px;color:rgba(255,255,255,.85);width:66px;flex-shrink:0;font-weight:500}
.bar-track{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:#fff}
.bar-amount{font-size:13px;color:#fff;font-weight:700;width:76px;text-align:right;flex-shrink:0}

/* 탭 */
.tabs{display:flex;background:var(--surface);border-bottom:2px solid var(--border)}
.tab{flex:1;padding:13px 4px;font-size:15px;font-weight:700;font-family:var(--font);background:none;border:none;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* 페이지 */
.page{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:48px}

/* 이월 배너 */
.banner{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;border:2px solid}
.banner-prev{background:var(--blue-light);border-color:var(--blue)}
.banner-next{background:#fffbeb;border-color:#d97706}
.banner-text{flex:1;font-size:14px;font-weight:600;line-height:1.5}
.banner-prev .banner-text{color:var(--blue)}
.banner-next .banner-text{color:#92400e}
.banner-btn{font-family:var(--font);font-size:13px;font-weight:700;color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;flex-shrink:0}
.banner-prev .banner-btn{background:var(--blue)}
.banner-next .banner-btn{background:#d97706}

/* 입력폼 */
.add-form{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.form-row{display:flex;gap:8px;align-items:center}
.input{font-family:var(--font);font-size:15px;font-weight:500;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);outline:none;width:100%}
.input:focus{border-color:var(--accent);background:#fff}
.input::placeholder{color:#bbb;font-weight:400}
.input-amount{font-size:16px;font-weight:700;width:108px;flex-shrink:0}
.input-memo{font-size:14px}
.select{font-family:var(--font);font-size:15px;font-weight:500;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:11px 13px;color:var(--text);outline:none;cursor:pointer;width:100%}
.btn-add{font-family:var(--font);font-size:16px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:11px 20px;cursor:pointer;flex-shrink:0}
.emoji-wrap{position:relative;flex-shrink:0}
.emoji-btn{font-size:24px;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:7px 9px;cursor:pointer;line-height:1}
.emoji-picker{position:absolute;top:46px;left:0;background:#fff;border:2px solid var(--border);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:4px;width:220px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:50}
.emoji-picker span{font-size:24px;cursor:pointer;padding:3px;border-radius:6px}

/* 필터바 */
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{font-family:var(--font);font-size:13px;font-weight:700;background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:6px 13px;cursor:pointer;color:var(--muted)}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* 세부내역 */
.section-label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx-item{background:var(--surface);border:2px solid var(--border);border-radius:15px;padding:13px 15px;display:flex;align-items:center;gap:11px}
.tx-drag{color:#ccc;font-size:17px;cursor:grab;padding:0 3px;flex-shrink:0;touch-action:none}
.tx-emoji{font-size:25px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-memo{font-size:12px;color:var(--muted);margin-top:2px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.tx-amount{font-size:16px;font-weight:900;flex-shrink:0}
.tx-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:20px;padding:3px 6px;flex-shrink:0}
.tx-del:active{color:var(--danger)}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:40px 0;font-weight:500}

/* 고정항목 */
.fixed-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;overflow:hidden}
.fcard-head{padding:13px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--border);background:var(--bg);flex-wrap:wrap;gap:8px}
.fcard-title{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fcard-right{display:flex;align-items:center;gap:8px}
.fcard-total{font-size:17px;font-weight:900;color:var(--accent)}
.btn-reflect{font-family:var(--font);font-size:13px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:7px 12px;cursor:pointer}
.fixed-row{display:flex;align-items:center;gap:6px;padding:11px 15px;border-bottom:1px solid var(--border)}
.fixed-row:last-child{border-bottom:none}
.fld{font-family:var(--font);font-size:15px;font-weight:500;background:none;border:none;outline:none;color:var(--text);min-width:0}
.fld::placeholder{color:#ccc}
.fld-name{flex:1;width:100%}
.fld-amt{font-size:15px;font-weight:700;width:64px;text-align:right;flex-shrink:0}
.fld-note{width:38px;text-align:center;flex-shrink:0;font-size:12px;color:var(--muted)}
.fix-drag{color:#ccc;font-size:17px;cursor:grab;padding:0 3px;flex-shrink:0;touch-action:none}
.fixed-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:20px;padding:2px 4px;flex-shrink:0}
.fcard-footer{padding:10px 15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fixed-add-btn{font-family:var(--font);font-size:14px;color:var(--accent);background:var(--accent-light);border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:700}
.ffilter-btn{font-family:var(--font);font-size:12px;font-weight:700;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;cursor:pointer;color:var(--muted)}
.ffilter-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.save-btn{font-family:var(--font);font-size:16px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:14px;cursor:pointer;width:100%}
.summary-box{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:0 16px}
.sb-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border)}
.sb-row:last-child{border-bottom:none}
.sb-label{font-size:15px;color:var(--muted);font-weight:500}
.sb-val{font-size:17px;font-weight:900}
.sb-row.pos .sb-label{color:var(--text);font-weight:700}
.sb-row.pos .sb-val{color:var(--accent);font-size:20px}
.sb-row.neg .sb-label{color:var(--text);font-weight:700}
.sb-row.neg .sb-val{color:var(--danger);font-size:20px}

/* 리포트 */
.income-summary{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.is-row{display:flex;justify-content:space-between;align-items:center}
.is-label{font-size:14px;font-weight:500;color:var(--muted)}
.is-val{font-size:17px;font-weight:900}
.is-val.income{color:var(--blue)}
.is-val.expense{color:var(--danger)}
.is-val.remain{color:var(--accent)}
.is-divider{height:2px;background:var(--border)}
.is-bar-wrap{height:10px;border-radius:99px;overflow:hidden;background:var(--border);display:flex}
.is-bar-expense{background:var(--danger);height:100%}
.is-pct{font-size:12px;color:var(--muted);font-weight:600;text-align:right}
.chart-box{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px}
.chart-title{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:110px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.chart-bar-wrap{width:100%;flex:1;display:flex;align-items:flex-end;gap:2px}
.chart-bar{flex:1;border-radius:3px 3px 0 0;min-height:3px}
.chart-bar.inc{background:rgba(37,99,235,.3)}
.chart-bar.exp{background:var(--border)}
.chart-bar.exp.cur{background:var(--accent)}
.chart-month{font-size:10px;color:var(--muted);font-weight:700}
.chart-legend{display:flex;gap:12px;justify-content:center;margin-top:10px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
.legend-dot{width:10px;height:10px;border-radius:3px}
.cat-box{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cat-row{display:flex;align-items:center;gap:10px}
.cat-icon{font-size:20px;width:26px;text-align:center}
.cat-info{flex:1}
.cat-name{font-size:14px;font-weight:700}
.cat-bar-track{height:5px;background:var(--border);border-radius:99px;margin-top:4px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:99px}
.cat-pct{font-size:13px;color:var(--muted);font-weight:700;width:32px;text-align:right}
.cat-amt{font-size:15px;font-weight:900;width:80px;text-align:right}

/* 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;gap:13px}
.modal-title{font-size:20px;font-weight:900}
.modal-sub{font-size:14px;color:var(--muted);font-weight:500}
.modal-list{display:flex;flex-direction:column;gap:7px;overflow-y:auto;flex:1}
.modal-item{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--bg);border:2px solid var(--border);border-radius:14px;cursor:pointer}
.modal-item.sel{border-color:var(--accent);background:var(--accent-light)}
.modal-item-info{flex:1}
.modal-item-name{font-size:16px;font-weight:700}
.modal-item-amt{font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.modal-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.modal-item.sel .modal-check{background:var(--accent);border-color:var(--accent);color:#fff}
.modal-btns{display:flex;gap:10px}
.modal-cancel{flex:1;font-family:var(--font);font-size:16px;font-weight:700;background:var(--bg);color:var(--muted);border:2px solid var(--border);border-radius:14px;padding:13px;cursor:pointer}
.modal-confirm{flex:2;font-family:var(--font);font-size:16px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:13px;cursor:pointer}

/* 로딩/토스트 */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--muted);font-size:15px;font-weight:500}
.spinner{width:20px;height:20px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1814;color:#fff;padding:12px 24px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

<!-- 로그인 -->
<div id="loginScreen">
  <div class="login-icon">💰</div>
  <div class="login-title">생활비 관리</div>
  <div class="login-sub">Google 계정으로 로그인하면<br>어디서든 데이터를 불러올 수 있어요</div>
  <button class="btn-google" id="loginBtn">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Google로 로그인
  </button>
</div>

<!-- 메인 -->
<div id="mainApp">
  <div class="topbar">
    <div class="month-nav">
      <button class="month-btn" id="prevBtn">&#8249;</button>
      <span class="month-label" id="monthLabel"></span>
      <button class="month-btn" id="nextBtn">&#8250;</button>
    </div>
    <button class="user-btn" id="logoutBtn">
      <img class="user-avatar" id="userAvatar" src="" alt="">
      <span id="userName"></span>
    </button>
  </div>

  <div class="summary">
    <div class="summary-label">이번 달 지출</div>
    <div class="summary-total" id="totalAmount">&#8361;0</div>
    <div id="summaryBars"></div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-0" onclick="goPage(0)">세부내역</button>
    <button class="tab" id="tab-1" onclick="goPage(1)">고정항목</button>
    <button class="tab" id="tab-2" onclick="goPage(2)">리포트</button>
  </div>

  <!-- 세부내역 -->
  <div id="page-0" class="page">
    <div id="prevBanner" class="banner banner-prev" style="display:none">
      <div>&#128197;</div>
      <div class="banner-text" id="prevBannerText"></div>
      <button class="banner-btn" onclick="doPrevCarry()">이월하기</button>
    </div>
    <div id="nextBanner" class="banner banner-next" style="display:none">
      <div>&#128197;</div>
      <div class="banner-text" id="nextBannerText"></div>
      <button class="banner-btn" onclick="doNextCarry()">가져오기</button>
    </div>
    <div class="add-form">
      <div class="form-row">
        <input class="input" id="inputName" placeholder="항목명">
        <input class="input input-amount" id="inputAmount" type="number" placeholder="금액">
      </div>
      <div class="form-row">
        <select class="select" id="inputCat" onchange="onCatChange()">
          <option value="카드">&#x1F4B3; 카드</option>
          <option value="식비">&#x1F35A; 식비</option>
          <option value="교통">&#x1F68C; 교통</option>
          <option value="쇼핑">&#x1F6CD; 쇼핑</option>
          <option value="문화">&#x1F3AC; 문화</option>
          <option value="의료">&#x1F48A; 의료</option>
          <option value="기타">&#x1F4E6; 기타</option>
          <option value="__custom__">&#x270F;&#xFE0F; 직접입력...</option>
        </select>
        <button class="btn-add" id="addTxBtn">추가</button>
      </div>
      <div class="form-row" id="customRow" style="display:none">
        <div class="emoji-wrap">
          <button class="emoji-btn" id="emojiBtn" type="button">&#x1F600;</button>
          <div class="emoji-picker" id="emojiPicker" style="display:none"></div>
        </div>
        <input class="input" id="customCatName" placeholder="카테고리 이름">
      </div>
      <input class="input input-memo" id="inputMemo" placeholder="&#x1F4DD; 메모 (선택사항)">
    </div>
    <div class="section-label">이번 달 내역</div>
    <div class="filter-bar">
      <button class="fbtn on" id="f-all" onclick="setTxF('all')">전체</button>
      <button class="fbtn" id="f-high" onclick="setTxF('high')">높은순</button>
      <button class="fbtn" id="f-low" onclick="setTxF('low')">낮은순</button>
      <button class="fbtn" id="f-cat" onclick="setTxF('cat')">유형별</button>
      <button class="fbtn" id="f-date" onclick="setTxF('date')">날짜순</button>
    </div>
    <div class="tx-list" id="txList"><div class="loading"><div class="spinner"></div>불러오는 중...</div></div>
  </div>

  <!-- 고정항목 -->
  <div id="page-1" class="page" style="display:none">
    <div class="fixed-card">
      <div class="fcard-head">
        <span class="fcard-title">&#x1F4B0; 수입</span>
        <div class="fcard-right">
          <span class="fcard-total" id="incTotal">0만</span>
          <button class="btn-reflect" onclick="openModal('inc')">내역반영</button>
        </div>
      </div>

// ── 상태 ──

const mk = (m,y) => `${y}-${m+1<10?'0':''}${m+1}`;
const curMk = () => mk(curM,curY);
const prevMk = () => { let m=curM-1,y=curY; if(m<0){m=11;y--;} return mk(m,y); };
const nextMk = () => { let m=curM+1,y=curY; if(m>11){m=0;y++;} return mk(m,y); };
const fmt  = n => '₩'+Math.round(n).toLocaleString('ko-KR');
const fmtM = n => { let v=parseFloat(n)||0; return (v<0?'-':'')+Math.abs(v).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만'; };
const sumA = a => a.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
const esc  = s => String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const deep = o => JSON.parse(JSON.stringify(o));

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

// ── 탭 전환 ──
window.goPage = function(p){
  curPage=p;
  for(let i=0;i<3;i++){
    document.getElementById('tab-'+i).className=i===p?'tab active':'tab';
    document.getElementById('page-'+i).style.display=i===p?'flex':'none';

};

// ── 스와이프 ──
let swX=0,swY=0,swDir=null;
document.addEventListener('touchstart',e=>{swX=e.touches[0].clientX;swY=e.touches[0].clientY;swDir=null;},{passive:true});
document.addEventListener('touchmove',e=>{
  if(swDir==='v') return;
  const dx=e.touches[0].clientX-swX, dy=e.touches[0].clientY-swY;
  if(!swDir){ if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8) swDir='h'; else if(Math.abs(dy)>8) swDir='v'; }
  if(swDir==='h') e.preventDefault();
},{passive:false});
document.addEventListener('touchend',e=>{
  if(swDir!=='h') return;
  const dx=swX-e.changedTouches[0].clientX;
  if(Math.abs(dx)>60){ if(dx>0&&curPage<2) goPage(curPage+1); else if(dx<0&&curPage>0) goPage(curPage-1); }
  swDir=null;
},{passive:true});

// ── 이모지 피커 ──
const picker=document.getElementById('emojiPicker');
EMOJIS.forEach(e=>{ const s=document.createElement('span'); s.textContent=e; s.onclick=()=>{ selEmoji=e; document.getElementById('emojiBtn').textContent=e; picker.style.display='none'; }; picker.appendChild(s); });

// ── Auth ──
document.getElementById('loginBtn').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>toast('로그인 실패'));

onAuthStateChanged(auth,user=>{

  } else {
    uid=null;
    document.getElementById('loginScreen').style.display='flex';

// ── 거래 실시간 ──
function listenTx(){
  if(txUnsub) txUnsub();
  txUnsub=onSnapshot(query(collection(db,'users',uid,'transactions'),orderBy('date','desc')),snap=>{
    allTx=snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  });
}
function curTxs(){ return allTx.filter(t=>t.date&&t.date.slice(0,7)===curMk()); }
function prevTxs(){ return allTx.filter(t=>t.date&&t.date.slice(0,7)===prevMk()); }
function nextTxs(){ return allTx.filter(t=>t.date&&t.date.slice(0,7)===nextMk()); }

async function addTx(){
  const name=document.getElementById('inputName').value.trim();
  const amount=parseInt(document.getElementById('inputAmount').value);
  const memo=document.getElementById('inputMemo').value.trim();
  const catSel=document.getElementById('inputCat').value;
  let cat,icon;
  if(catSel==='__custom__'){
    const cn=document.getElementById('customCatName').value.trim();
    if(!cn){ toast('카테고리 이름을 입력해주세요'); return; }
    cat=cn; icon=selEmoji;
  } else { cat=catSel; icon=null; }
  if(!name||!amount||amount<=0){ toast('항목과 금액을 입력해주세요'); return; }
  const today=new Date();
  const date=curMk()+'-'+(today.getDate()<10?'0':'')+today.getDate();
  await addDoc(collection(db,'users',uid,'transactions'),{name,amount,cat,icon:icon||null,memo:memo||'',date,createdAt:Date.now()});
  document.getElementById('inputName').value='';
  document.getElementById('inputAmount').value='';
  document.getElementById('inputMemo').value='';
  toast('추가됐어요 ✓');
}
async function delTx(id){ await deleteDoc(doc(db,'users',uid,'transactions',id)); toast('삭제됐어요'); }
window.delTxHandler=id=>delTx(id);

// ── 이월 ──
function checkBanners(){
  const prev=prevTxs(), next=nextTxs();
  const pb=document.getElementById('prevBanner'), nb=document.getElementById('nextBanner');
  if(prev.length>0){
    let m=curM-1,y=curY; if(m<0){m=11;y--;}

  } else pb.style.display='none';

    let m=curM+1,y=curY; if(m>11){m=0;y++;}

    nb.style.display='flex';
  } else nb.style.display='none';

window.doPrevCarry=async function(){
  const prev=prevTxs();
  const today=new Date();
  const date=curMk()+'-'+(today.getDate()<10?'0':'')+today.getDate();
  for(const t of prev) await addDoc(collection(db,'users',uid,'transactions'),{name:t.name,amount:t.amount,cat:t.cat,icon:t.icon||null,memo:t.memo||'',date,createdAt:Date.now()});
  document.getElementById('prevBanner').style.display='none';

};
window.doNextCarry=async function(){
  const next=nextTxs();
  const today=new Date();
  const date=curMk()+'-'+(today.getDate()<10?'0':'')+today.getDate();
  for(const t of next) await addDoc(collection(db,'users',uid,'transactions'),{name:t.name,amount:t.amount,cat:t.cat,icon:t.icon||null,memo:t.memo||'',date,createdAt:Date.now()});
  document.getElementById('nextBanner').style.display='none';
  toast(next.length+'건 가져왔어요 ✓');
};

// ── 렌더 ──
function render(){
  const d=new Date(curY,curM,1);
  document.getElementById('monthLabel').textContent=d.toLocaleDateString('ko-KR',{year:'numeric',month:'long'});
  const txs=curTxs();
  const total=txs.reduce((s,t)=>s+t.amount,0);
  document.getElementById('totalAmount').textContent=fmt(total);
  const cats={};
  txs.forEach(t=>{ cats[t.cat]=(cats[t.cat]||0)+t.amount; });
  const sorted=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);
  const maxC=sorted[0]?.[1]||1;
  document.getElementById('summaryBars').innerHTML=sorted.map(([c,a])=>`
    <div class="bar-row"><span class="bar-label">${ci(c)} ${c}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.round(a/maxC*100)}%"></div></div><span class="bar-amount">${fmt(a)}</span></div>`).join('');
  checkBanners();
  renderTxList(txs);
}

// ── 필터 ──
window.setTxF=function(f){
  txFilter=f;
  ['all','high','low','cat','date'].forEach(k=>{ document.getElementById('f-'+k).className='fbtn'+(txFilter===k?' on':''); });
  renderTxList(curTxs());
};
window.setFixF=function(type,f){
  if(type==='inc'){
    incFilter=f;
    ['all','high','low'].forEach(k=>{ document.getElementById('fi-'+k).className='ffilter-btn'+(incFilter===k?' on':''); });
  } else {
    fixFilter=f;
    ['all','high','low'].forEach(k=>{ document.getElementById('ff-'+k).className='ffilter-btn'+(fixFilter===k?' on':''); });
  }
  renderFixed();
};
function applyTxFilter(txs){
  const a=[...txs];
  if(txFilter==='high') a.sort((x,y)=>y.amount-x.amount);
  else if(txFilter==='low') a.sort((x,y)=>x.amount-y.amount);
  else if(txFilter==='cat') a.sort((x,y)=>(x.cat||'').localeCompare(y.cat||''));
  else if(txFilter==='date') a.sort((x,y)=>(x.date||'').localeCompare(y.date||''));
  return a;
}
function applyFixFilter(items,f){
  const a=[...items];
  if(f==='high') a.sort((x,y)=>y.amount-x.amount);
  else if(f==='low') a.sort((x,y)=>x.amount-y.amount);
  return a;
}

// ── 세부내역 렌더 ──
let dragSrcTx=null;
function renderTxList(txs){
  const list=document.getElementById('txList');
  const filtered=applyTxFilter(txs);
  if(!filtered.length){ list.innerHTML='<div class="empty">아직 지출 내역이 없어요</div>'; return; }
  list.innerHTML='';
  filtered.forEach(t=>{
    const item=document.createElement('div');
    item.className='tx-item';
    item.innerHTML=
      `<div class="tx-drag">&#8942;</div>`+
      `<span class="tx-emoji">${t.icon||ci(t.cat)}</span>`+
      `<div class="tx-info">`+
        `<div class="tx-name">${esc(t.name)}</div>`+
        (t.memo?`<div class="tx-memo">📝 ${esc(t.memo)}</div>`:'')+
        `<div class="tx-meta">${t.cat} · ${t.date.slice(5).replace('-','/')}</div>`+
      `</div>`+
      `<span class="tx-amount">${fmt(t.amount)}</span>`+
      `<button class="tx-del" onclick="window.delTxHandler('${t.id}')">&#x00D7;</button>`;
    list.appendChild(item);
  });
}

// ── 고정항목 Firebase (월별 독립 저장) ──
// 컬렉션: users/{uid}/fixed_monthly
// 문서 ID = "2026-05" 형태로 월마다 별도 문서

async function loadFixed(){
  const k=curMk();
  const docRef=doc(db,'users',uid,'fixed_monthly',k);
  const snap=await getDocs(collection(db,'users',uid,'fixed_monthly'));

  // 이번 달 문서 찾기
  const thisDoc=snap.docs.find(d=>d.id===k);
  if(thisDoc){
    incItems=deep(thisDoc.data().incItems||[]);
    fixItems=deep(thisDoc.data().fixItems||[]);
  } else {
    // 없으면 가장 최근 달 복사 (월별 독립 유지)
    const sorted=snap.docs.sort((a,b)=>b.id.localeCompare(a.id));
    if(sorted.length>0){
      incItems=deep(sorted[0].data().incItems||[]);
      fixItems=deep(sorted[0].data().fixItems||[]);
    } else {
      incItems=[{id:1,name:'봉급',amount:489},{id:2,name:'초과근무',amount:60},{id:3,name:'출장비',amount:9}];
      fixItems=[
        {id:1,name:'십일조',amount:49,note:''},{id:2,name:'일천·주일',amount:17.2,note:''},
        {id:3,name:'기부',amount:5,note:''},{id:4,name:'통신비',amount:15,note:'카드'},
        {id:5,name:'주택대출',amount:75,note:''},{id:6,name:'학예·용지회',amount:4,note:''},
        {id:7,name:'점심식비',amount:10,note:'카드'},{id:8,name:'보험(전부)',amount:47,note:''},
        {id:9,name:'관리비',amount:18,note:'국민'},{id:10,name:'가스비+주차비',amount:15,note:'현대'},
        {id:11,name:'주유비',amount:20,note:'국민'},{id:12,name:'축구+피아노+미술+킥복싱',amount:44,note:'현대'},
        {id:13,name:'대출+장모님',amount:116,note:''}
      ];
    }
  }
  renderFixed();
}

async function saveFixed(){
  if(!uid) return;
  try{
    const k=curMk();
    // 문서 ID를 월키로 직접 지정 → 같은 달은 항상 같은 문서 덮어씀
    await setDoc(doc(db,'users',uid,'fixed_monthly',k),{
      incItems:deep(incItems),
      fixItems:deep(fixItems)
    });
    toast('저장됐어요 ✓');
  } catch(e){ toast('저장 실패: '+e.message); }
}

function renderFixed(){
  updateTotals();
  buildFixedRows();
}

function updateTotals(){
  const iSum=sumA(incItems), fSum=sumA(fixItems);
  document.getElementById('incTotal').textContent=fmtM(iSum);
  document.getElementById('fixTotal').textContent=fmtM(fSum);
  document.getElementById('sbInc').textContent=fmtM(iSum);
  document.getElementById('sbFix').textContent=fmtM(fSum);
  const diff=iSum-fSum;
  document.getElementById('sbDiff').textContent=(diff>=0?'+':'')+fmtM(diff);
  document.getElementById('sbRow').className='sb-row '+(diff>=0?'pos':'neg');
}

function buildFixedRows(){
  buildRows('incRows', incItems, applyFixFilter(incItems,incFilter), false);
  buildRows('fixRows', fixItems, applyFixFilter(fixItems,fixFilter), true);
}

function buildRows(containerId, srcArr, displayArr, hasNote){
  // srcArr = 원본 (incItems 또는 fixItems)
  // displayArr = 필터/정렬 적용된 표시용 (복사본)
  const container=document.getElementById(containerId);
  container.innerHTML='';
  displayArr.forEach(item=>{
    // 원본에서 id로 인덱스 찾기
    const origIdx=srcArr.findIndex(o=>o.id===item.id);
    const row=document.createElement('div');
    row.className='fixed-row';

    const handle=document.createElement('span');
    handle.className='fix-drag';
    handle.textContent='⠿';

    const ni=document.createElement('input');
    ni.className='fld fld-name';
    ni.placeholder='항목명';
    ni.value=item.name||'';
    ni.addEventListener('input',function(){
      if(origIdx>=0) srcArr[origIdx].name=this.value;
    });

    const ai=document.createElement('input');
    ai.className='fld fld-amt';
    ai.type='number';
    ai.step='0.1';
    ai.placeholder='0';
    ai.value=item.amount||'';
    ai.addEventListener('input',function(){
      if(origIdx>=0){ srcArr[origIdx].amount=parseFloat(this.value)||0; updateTotals(); }
    });

    const delBtn=document.createElement('button');
    delBtn.className='fixed-del';
    delBtn.textContent='×';
    delBtn.addEventListener('click',()=>{
      if(origIdx>=0) srcArr.splice(origIdx,1);
      renderFixed();
    });

    row.appendChild(handle);
    row.appendChild(ni);
    row.appendChild(ai);
    if(hasNote){
      const note=document.createElement('input');
      note.className='fld fld-note';
      note.placeholder='비고';
      note.value=item.note||'';
      note.addEventListener('input',function(){
        if(origIdx>=0) srcArr[origIdx].note=this.value;
      });
      row.appendChild(note);
    }
    row.appendChild(delBtn);
    container.appendChild(row);
  });
}

document.getElementById('addIncBtn').onclick=()=>{ incItems.push({id:Date.now(),name:'',amount:0}); renderFixed(); };
document.getElementById('addFixBtn').onclick=()=>{ fixItems.push({id:Date.now(),name:'',amount:0,note:''}); renderFixed(); };
document.getElementById('saveBtn').onclick=saveFixed;

// 달 이동 시 고정항목 다시 로드
function reloadFixed(){ incItems=[]; fixItems=[]; loadFixed(); }

// ── 모달 ──
window.openModal=function(type){
  modalType=type; modalSel={};
  const items=type==='inc'?incItems:fixItems;
  document.getElementById('modalTitle').textContent=type==='inc'?'수입 항목 선택':'고정지출 항목 선택';
  document.getElementById('modalList').innerHTML=items.map((item,idx)=>
    `<div class="modal-item" id="mi-${idx}" onclick="toggleModal(${idx})"><div class="modal-item-info"><div class="modal-item-name">${esc(item.name||'(이름없음)')}</div><div class="modal-item-amt">${fmtM(item.amount)}</div></div><div class="modal-check" id="mc-${idx}"></div></div>`
  ).join('');
  document.getElementById('modalOverlay').style.display='flex';
};
window.toggleModal=function(idx){
  if(modalSel[idx]) delete modalSel[idx]; else modalSel[idx]=true;
  document.getElementById('mi-'+idx).className='modal-item'+(modalSel[idx]?' sel':'');
  document.getElementById('mc-'+idx).textContent=modalSel[idx]?'✓':'';
};
window.closeModal=()=>document.getElementById('modalOverlay').style.display='none';
window.closeModalBg=e=>{ if(e.target===document.getElementById('modalOverlay')) closeModal(); };
window.confirmReflect=async function(){
  const items=modalType==='inc'?incItems:fixItems;
  const cat=modalType==='inc'?'수입':'고정지출';
  const today=new Date();
  const date=curMk()+'-'+(today.getDate()<10?'0':'')+today.getDate();
  const selected=Object.keys(modalSel);
  if(!selected.length){ toast('항목을 선택해주세요'); return; }
  for(const i of selected){
    const item=items[parseInt(i)];
    if(!item||!item.amount) continue;
    await addDoc(collection(db,'users',uid,'transactions'),{
      name:item.name||'고정항목',
      amount:Math.round((parseFloat(item.amount)||0)*10000),
      cat, icon:modalType==='inc'?'💰':'📋',
      memo:'', date, createdAt:Date.now()
    });
  }
  closeModal();
  toast(selected.length+'개 항목 반영됐어요 ✓');
  goPage(0);
};

// ── 리포트 ──
function renderReport(){
  const incomeTotal=sumA(incItems)*10000;
  const txs=curTxs();
  const expenseTotal=txs.reduce((s,t)=>s+t.amount,0);
  const remain=incomeTotal-expenseTotal;
  const pct=incomeTotal>0?Math.min(Math.round(expenseTotal/incomeTotal*100),100):0;
  document.getElementById('incomeSummary').innerHTML=
    `<div class="is-row"><span class="is-label">💰 이번 달 수입</span><span class="is-val income">${fmt(incomeTotal)}</span></div>`+
    `<div class="is-row"><span class="is-label">💸 이번 달 지출</span><span class="is-val expense">${fmt(expenseTotal)}</span></div>`+
    `<div class="is-divider"></div>`+
    `<div class="is-row"><span class="is-label">✅ 남은 금액</span><span class="is-val ${remain>=0?'remain':'expense'}">${fmt(remain)}</span></div>`+
    `<div class="is-bar-wrap"><div class="is-bar-expense" style="width:${pct}%"></div></div>`+
    `<div class="is-pct">지출 ${pct}%</div>`;

  const months=[];
  for(let i=5;i>=0;i--){
    let m=curM-i,y=curY; while(m<0){m+=12;y--;}
    const k=mk(m,y);
    const exp=allTx.filter(t=>t.date&&t.date.slice(0,7)===k).reduce((s,t)=>s+t.amount,0);
    months.push({label:new Date(y,m,1).toLocaleDateString('ko-KR',{month:'short'}),exp,inc:incomeTotal,isCur:m===curM&&y===curY});
  }
  const maxV=Math.max(...months.map(m=>Math.max(m.exp,m.inc)),1);
  document.getElementById('monthlyChart').innerHTML=months.map(m=>
    `<div class="chart-col"><div class="chart-bar-wrap">`+
    `<div class="chart-bar inc" style="height:${Math.max(Math.round(m.inc/maxV*100),3)}%"></div>`+
    `<div class="chart-bar exp${m.isCur?' cur':''}" style="height:${Math.max(Math.round(m.exp/maxV*100),3)}%"></div>`+
    `</div><div class="chart-month">${m.label}</div></div>`).join('');

  const tot=expenseTotal||1;
  const cats={};
  txs.forEach(t=>{ cats[t.cat]=(cats[t.cat]||0)+t.amount; });
  const sc=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  const bd=document.getElementById('catBreakdown');
  if(!sc.length){ bd.innerHTML='<div class="chart-title">카테고리별 분석</div><div class="empty">데이터가 없어요</div>'; return; }
  bd.innerHTML='<div class="chart-title">카테고리별 분석</div>'+sc.map(([c,a])=>
    `<div class="cat-row"><div class="cat-icon">${ci(c)}</div><div class="cat-info"><span class="cat-name">${c}</span><div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round(a/tot*100)}%;background:${cc(c)}"></div></div></div><span class="cat-pct">${Math.round(a/tot*100)}%</span><span class="cat-amt">${fmt(a)}</span></div>`).join('');
}

// ── 네비게이션 ──
document.getElementById('prevBtn').onclick=()=>{
  curM--; if(curM<0){curM=11;curY--;} render(); reloadFixed();
};
document.getElementById('nextBtn').onclick=()=>{
  curM++; if(curM>11){curM=0;curY++;} render(); reloadFixed();
};
document.getElementById('addTxBtn').onclick=addTx;
document.getElementById('inputAmount').addEventListener('keydown',e=>{ if(e.key==='Enter') addTx(); });
render();
</script>
</body>
</html>
